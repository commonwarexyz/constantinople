name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.head_ref || github.ref_name || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  UDEPS_VERSION: 0.1.60

jobs:
  test:
    name: "Test (partition: ${{ matrix.partition }}/4)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        partition: [1, 2, 3, 4]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Clear disk space
        uses: ./.github/actions/disk
      - name: Run setup
        uses: ./.github/actions/setup
        with:
          rust-cache-save: ${{ matrix.partition == 1 }}
      - uses: taiki-e/install-action@just
      - uses: taiki-e/install-action@nextest
      - name: Test deployment script
        if: matrix.partition == 1
        run: just deploy-script-test
      - name: cargo test
        run: cargo nextest run --workspace --all --all-features --locked --partition hash:${{ matrix.partition }}/4

  test-gate:
    name: Test
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Tests failed or were cancelled"
            exit 1
          fi
          echo "All tests passed successfully!"

  explorer:
    name: Explorer
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Clear disk space
        uses: ./.github/actions/disk
      - name: Run setup
        uses: ./.github/actions/setup
        with:
          targets: wasm32-unknown-unknown
      - name: Install just, nextest and wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.43.0,cargo-nextest,wasm-pack@0.13.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: explorer/.nvmrc
          cache: npm
          cache-dependency-path: explorer/package-lock.json
      - name: Restore Exoware TypeScript packages
        uses: actions/cache@v4
        with:
          path: .exoware
          key: exoware-ts-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'explorer/scripts/build-exoware.sh', 'explorer/.nvmrc') }}
      - name: Build Exoware packages and install Explorer dependencies
        run: just explorer-install
      - name: Export native Explorer fixtures
        run: just explorer-fixtures "$RUNNER_TEMP/explorer-fixtures"
      - name: Type check and test the Explorer against native fixtures
        run: just explorer-test
        env:
          EXPLORER_FIXTURE_DIR: ${{ runner.temp }}/explorer-fixtures
      - name: Build the Explorer
        run: just explorer-build

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Clear disk space
        uses: ./.github/actions/disk
      - name: Run setup
        uses: ./.github/actions/setup
      - uses: taiki-e/install-action@just
      - name: build
        run: just build --locked

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Run setup
        uses: ./.github/actions/setup
        with:
          additional-toolchain: nightly
          additional-components: rustfmt,clippy
      - uses: taiki-e/install-action@just
      - name: fmt + lint
        run: just lint

  docs:
    name: Check Docs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Clear disk space
        uses: ./.github/actions/disk
      - name: Run setup
        uses: ./.github/actions/setup
      - uses: taiki-e/install-action@just
      - uses: taiki-e/install-action@nextest
      - name: check docs
        run: just docs-check
      - name: test docs
        run: just docs-test

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Clear disk space
        uses: ./.github/actions/disk
      - name: Run setup
        uses: ./.github/actions/setup
        with:
          additional-toolchain: nightly
      - name: Install just & cargo-udeps
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.43.0,cargo-udeps@${{ env.UDEPS_VERSION }}
      - name: Check for unused dependencies
        run: just udeps

