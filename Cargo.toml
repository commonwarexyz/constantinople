commonware-deployer = { git = "https://www.github.com/commonwarexyz/monorepo.git", branch = "andre/iouring-runtime-v7" }
commonware-formatting = { git = "https://www.github.com/commonwarexyz/monorepo.git", branch = "andre/iouring-runtime-v7" }
commonware-glue = { git = "https://www.github.com/commonwarexyz/monorepo.git", branch = "andre/iouring-runtime-v7" }
