[workspace.package]
version = "2026.7.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"
authors = ["commonware"]
homepage = "https://commonware.xyz"
repository = "https://github.com/commonwarexyz/constantinople"
keywords = ["configuration", "traits", "generics"]
categories = []
exclude = ["**/target"]

[workspace]
resolver = "2"
members = [
  "crates/application",
  "crates/curve25519",
  "crates/engine",
  "crates/mempool",
  "crates/primitives",
  "bin/deploy",
  "bin/spammer",
  "bin/validator",
]

[workspace.lints.rust]
unused-must-use = "deny"
rust-2018-idioms = "deny"

[workspace.lints.rustdoc]
all = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
missing-const-for-fn = "warn"
use-self = "warn"
option-if-let-else = "warn"
redundant-clone = "warn"
large_futures = "warn"

[workspace.dependencies]
# Workspace
constantinople-engine = { path = "crates/engine" }
constantinople-mempool = { path = "crates/mempool" }
constantinople-primitives = { path = "crates/primitives" }
constantinople-application = { path = "crates/application" }
constantinople-curve25519 = { path = "crates/curve25519" }

# Commonware
commonware-actor = { path = "../monorepo-optimize-glue-sync-glue-tweaks-plus/actor" }
commonware-p2p = { path = "../monorepo-optimize-glue-sync-glue-tweaks-plus/p2p" }
commonware-glue = { path = "../monorepo-optimize-glue-sync-glue-tweaks-plus/glue" }
commonware-math = { path = "../monorepo-optimize-glue-sync-glue-tweaks-plus/math" }
commonware-codec = { path = "../monorepo-optimize-glue-sync-glue-tweaks-plus/codec" }
commonware-formatting = { path = "../monorepo-optimize-glue-sync-glue-tweaks-plus/formatting" }
commonware-utils = { path = "../monorepo-optimize-glue-sync-glue-tweaks-plus/utils" }
commonware-coding = { path = "../monorepo-optimize-glue-sync-glue-tweaks-plus/coding" }
commonware-macros = { path = "../monorepo-optimize-glue-sync-glue-tweaks-plus/macros" }
commonware-runtime = { path = "../monorepo-optimize-glue-sync-glue-tweaks-plus/runtime" }
commonware-storage = { path = "../monorepo-optimize-glue-sync-glue-tweaks-plus/storage" }
commonware-deployer = { path = "../monorepo-optimize-glue-sync-glue-tweaks-plus/deployer" }
commonware-parallel = { path = "../monorepo-optimize-glue-sync-glue-tweaks-plus/parallel" }
commonware-resolver = { path = "../monorepo-optimize-glue-sync-glue-tweaks-plus/resolver" }
commonware-broadcast = { path = "../monorepo-optimize-glue-sync-glue-tweaks-plus/broadcast" }
commonware-consensus = { path = "../monorepo-optimize-glue-sync-glue-tweaks-plus/consensus" }
commonware-cryptography = { path = "../monorepo-optimize-glue-sync-glue-tweaks-plus/cryptography", default-features = false }
commonware-conformance = { path = "../monorepo-optimize-glue-sync-glue-tweaks-plus/conformance" }
commonware-invariants = { path = "../monorepo-optimize-glue-sync-glue-tweaks-plus/invariants" }

# Other
axum = "0.8"
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
clap = { version = "4", default-features = false }
rand = { version = "0.10.2", default-features = false }
rand_core = { version = "0.10.1", default-features = false }
bytes = { version = "1.11.1", default-features = false }
criterion = "0.7.0"
rayon = "1.10"
serde = { version = "1.0.228", default-features = false }
tokio = { version = "1.50", default-features = false }
tower = { version = "0.5", default-features = false }
rstest = "0.26.0"
futures = { version = "0.3.31", default-features = false }
tracing = { version = "0.1.41", default-features = false }
arbitrary = { version = "1.4.2", features = ["derive"] }
ahash = "0.8.12"
reqwest = { version = "0.13.4", default-features = false }
thiserror = { version = "2.0.18", default-features = false }
serde_json = { version = "1.0.149", default-features = false }
serde_yaml = "0.9"
mimalloc = "0.1.52"
sysinfo = "0.39.6"
derive_more = { version = "2.1.1", default-features = false }
prometheus-client = { version = "0.24.0", default-features = false }
tracing-subscriber = "0.3"
sha2 = { version = "0.11.0", default-features = false }
subtle = { version = "2.6.1", default-features = false }
zeroize = "1.9.0"
ed25519-consensus = "2.1.0"

[profile.samply]
inherits = "release"
debug = true
