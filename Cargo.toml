commonware-math = { git = "https://www.github.com/commonwarexyz/monorepo.git", branch = "andre/iouring-runtime-v7" }
commonware-p2p = { git = "https://www.github.com/commonwarexyz/monorepo.git", branch = "andre/iouring-runtime-v7" }
commonware-parallel = { git = "https://www.github.com/commonwarexyz/monorepo.git", branch = "andre/iouring-runtime-v7" }
commonware-resolver = { git = "https://www.github.com/commonwarexyz/monorepo.git", branch = "andre/iouring-runtime-v7" }
commonware-runtime = { git = "https://www.github.com/commonwarexyz/monorepo.git", branch = "andre/iouring-runtime-v7" }
commonware-runtime-macros = { git = "https://www.github.com/commonwarexyz/monorepo.git", branch = "andre/iouring-runtime-v7" }
commonware-storage = { git = "https://www.github.com/commonwarexyz/monorepo.git", branch = "andre/iouring-runtime-v7" }
commonware-stream = { git = "https://www.github.com/commonwarexyz/monorepo.git", branch = "andre/iouring-runtime-v7" }
commonware-utils = { git = "https://www.github.com/commonwarexyz/monorepo.git", branch = "andre/iouring-runtime-v7" }
exoware-qmdb = { git = "https://github.com/exowarexyz/monorepo.git", branch = "main" }
exoware-sdk = { git = "https://github.com/exowarexyz/monorepo.git", branch = "main" }
exoware-server = { git = "https://github.com/exowarexyz/monorepo.git", branch = "main" }
exoware-simplex = { git = "https://github.com/exowarexyz/monorepo.git", branch = "main" }
exoware-simulator = { git = "https://github.com/exowarexyz/monorepo.git", branch = "main" }
exoware-sql = { git = "https://github.com/exowarexyz/monorepo.git", branch = "main" }

