[workspace.package]
version = "2026.7.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"
authors = ["commonware"]
homepage = "https://commonware.xyz"
repository = "https://github.com/commonwarexyz/constantinople"
keywords = ["configuration", "traits", "generics"]
categories = []
exclude = ["**/target"]

[workspace]
resolver = "2"
exclude = ["vendor/exoware-sdk", "vendor/exoware-qmdb", "vendor/exoware-simplex", "vendor/exoware-simulator"]
members = [
  "crates/application",
  "crates/engine",
  "crates/indexer",
  "crates/mempool",
  "crates/primitives",
  "bin/deploy",
  "bin/spammer",
  "bin/validator",
]

[workspace.lints.rust]
unused-must-use = "deny"
rust-2018-idioms = "deny"

[workspace.lints.rustdoc]
all = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
missing-const-for-fn = "warn"
use-self = "warn"
option-if-let-else = "warn"
redundant-clone = "warn"
large_futures = "warn"

[workspace.dependencies]
# Workspace
constantinople-engine = { path = "crates/engine" }
constantinople-indexer = { path = "crates/indexer" }
constantinople-mempool = { path = "crates/mempool" }
constantinople-primitives = { path = "crates/primitives" }
constantinople-application = { path = "crates/application" }

# Commonware
commonware-actor = "=2026.9.0"
commonware-p2p = "=2026.9.0"
commonware-glue = "=2026.9.0"
commonware-math = "=2026.9.0"
commonware-codec = "=2026.9.0"
commonware-formatting = "=2026.9.0"
commonware-utils = "=2026.9.0"
commonware-coding = "=2026.9.0"
commonware-macros = "=2026.9.0"
commonware-runtime = "=2026.9.0"
commonware-storage = "=2026.9.0"
commonware-deployer = "=2026.9.0"
commonware-parallel = "=2026.9.0"
commonware-resolver = "=2026.9.0"
commonware-broadcast = "=2026.9.0"
commonware-consensus = "=2026.9.0"
commonware-cryptography = { version = "=2026.9.0", default-features = false }

# Exoware
exoware-sdk = "=2026.9.0"
exoware-server = "=2026.9.0"
exoware-qmdb = "=2026.9.0"
exoware-simplex = "=2026.9.0"
exoware-simulator = "=2026.9.0"
exoware-sql = "=2026.9.0"
datafusion = "55"

# Other
axum = "0.8"
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
clap = { version = "4", default-features = false }
rand = { version = "0.10.2", default-features = false }
bytes = { version = "1.11.1", default-features = false }
criterion = "0.7.0"
rayon = "1.10"
serde = { version = "1.0.228", default-features = false }
tokio = { version = "1.50", default-features = false }
tower = { version = "0.5", default-features = false }
rstest = "0.26.0"
futures = { version = "0.3.31", default-features = false }
tracing = { version = "0.1.41", default-features = false }
arbitrary = { version = "1.4.2", features = ["derive"] }
ahash = "0.8.12"
reqwest = { version = "0.13.4", default-features = false }
thiserror = { version = "2.0.18", default-features = false }
serde_json = { version = "1.0.149", default-features = false }
serde_yaml = "0.9"
mimalloc = "0.1.52"
derive_more = { version = "2.1.1", default-features = false }
prometheus-client = { version = "0.24.0", default-features = false }
tracing-subscriber = "0.3"

[profile.samply]
inherits = "release"
debug = true

# Exoware codec compatibility patches are documented in vendor/README.md.
# Pin direct and transitive Commonware dependencies to PR #4739.
[patch.crates-io]
exoware-sdk = { path = "vendor/exoware-sdk" }
exoware-qmdb = { path = "vendor/exoware-qmdb" }
exoware-simplex = { path = "vendor/exoware-simplex" }
exoware-simulator = { path = "vendor/exoware-simulator" }
commonware-actor = { git = "https://github.com/commonwarexyz/monorepo", rev = "8d5a87ecf49130dab67fb1a062d4413fd8663995" }
