commonware-coding = { git = "https://www.github.com/commonwarexyz/monorepo.git", branch = "andre/iouring-runtime-v7" }
commonware-conformance = { git = "https://www.github.com/commonwarexyz/monorepo.git", branch = "andre/iouring-runtime-v7" }
