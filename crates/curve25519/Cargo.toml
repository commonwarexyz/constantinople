[package]
name = "constantinople-curve25519"
description = "Vendored SIMD-accelerated Ed25519 batch verification backend"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
arbitrary = { workspace = true, optional = true }
bytes.workspace = true
commonware-codec.workspace = true
commonware-formatting.workspace = true
commonware-math.workspace = true
commonware-parallel.workspace = true
commonware-utils.workspace = true
rand_core.workspace = true
sha2 = { workspace = true, features = ["zeroize"] }
subtle.workspace = true
zeroize = { workspace = true, features = ["zeroize_derive"] }

[dev-dependencies]
commonware-conformance.workspace = true
commonware-cryptography = { workspace = true, features = ["std"] }
commonware-invariants.workspace = true
commonware-parallel = { workspace = true, features = ["std"] }
commonware-utils = { workspace = true, features = ["std"] }
ed25519-consensus.workspace = true

[features]
default = ["std"]
arbitrary = [
  "commonware-codec/arbitrary",
  "commonware-math/arbitrary",
  "commonware-utils/arbitrary",
  "dep:arbitrary",
]
std = [
  "bytes/std",
  "commonware-codec/std",
  "commonware-formatting/std",
  "commonware-math/std",
  "commonware-parallel/std",
  "commonware-utils/std",
]
