[package]
name = "commonware-consensus"
edition = "2024"
publish = true
version = "2026.9.0"
license = "MIT OR Apache-2.0"
description = "Order opaque messages in a Byzantine environment."
readme = "README.md"
homepage = "https://commonware.xyz"
repository = "https://github.com/commonwarexyz/monorepo/tree/main/consensus"
documentation = "https://docs.rs/commonware-consensus"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(full_bench)", "cfg(huge_bench)", "cfg(benchmark_tracking)", "cfg(generate_conformance_tests)", "cfg(commonware_stability_BETA)", "cfg(commonware_stability_GAMMA)", "cfg(commonware_stability_DELTA)", "cfg(commonware_stability_EPSILON)", "cfg(commonware_stability_RESERVED)"] }
unused-must-use = "deny"
rust-2018-idioms = "deny"
warnings = "deny"

[lints.clippy]
missing-const-for-fn = "warn"
use-self = "warn"
redundant-clone = "warn"
option-if-let-else = "warn"
disallowed_types = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
undocumented_unsafe_blocks = "deny"
multiple_inherent_impl = "deny"
unused-async = "warn"
large_futures = "warn"
suspicious_op_assign_impl = "allow"

[dependencies]
arbitrary = { version = "1.4.2", optional = true, features = ["derive"] }
bytes = { version = "1.12.1", default-features = false }
cfg-if = { version = "1.0.4" }
commonware-actor = { git = "https://github.com/commonwarexyz/monorepo", rev = "2fd3af88f2cdeb6424d82f45961f803d812d6c99" }
commonware-broadcast = { git = "https://github.com/commonwarexyz/monorepo", rev = "2fd3af88f2cdeb6424d82f45961f803d812d6c99" }
commonware-codec = { git = "https://github.com/commonwarexyz/monorepo", rev = "2fd3af88f2cdeb6424d82f45961f803d812d6c99", default-features = false }
commonware-coding = { git = "https://github.com/commonwarexyz/monorepo", rev = "2fd3af88f2cdeb6424d82f45961f803d812d6c99" }
commonware-cryptography = { git = "https://github.com/commonwarexyz/monorepo", rev = "2fd3af88f2cdeb6424d82f45961f803d812d6c99", default-features = false, features = ["bls12381"] }
commonware-formatting = { git = "https://github.com/commonwarexyz/monorepo", rev = "2fd3af88f2cdeb6424d82f45961f803d812d6c99", default-features = false }
commonware-macros = { git = "https://github.com/commonwarexyz/monorepo", rev = "2fd3af88f2cdeb6424d82f45961f803d812d6c99", default-features = false }
commonware-math = { git = "https://github.com/commonwarexyz/monorepo", rev = "2fd3af88f2cdeb6424d82f45961f803d812d6c99", default-features = false }
commonware-parallel = { git = "https://github.com/commonwarexyz/monorepo", rev = "2fd3af88f2cdeb6424d82f45961f803d812d6c99", default-features = false }
commonware-resolver = { git = "https://github.com/commonwarexyz/monorepo", rev = "2fd3af88f2cdeb6424d82f45961f803d812d6c99" }
commonware-utils = { git = "https://github.com/commonwarexyz/monorepo", rev = "2fd3af88f2cdeb6424d82f45961f803d812d6c99", default-features = false }
futures = { version = "0.3.32" }
rand = { version = "0.10.2", default-features = false, features = ["std_rng"] }
rand_core = { version = "0.10.1", default-features = false }
thiserror = { version = "2.0.18", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
commonware-macros = { git = "https://github.com/commonwarexyz/monorepo", rev = "2fd3af88f2cdeb6424d82f45961f803d812d6c99", default-features = false, features = ["std"] }
commonware-p2p = { git = "https://github.com/commonwarexyz/monorepo", rev = "2fd3af88f2cdeb6424d82f45961f803d812d6c99" }
commonware-parallel = { git = "https://github.com/commonwarexyz/monorepo", rev = "2fd3af88f2cdeb6424d82f45961f803d812d6c99", default-features = false, features = ["std"] }
commonware-runtime = { git = "https://github.com/commonwarexyz/monorepo", rev = "2fd3af88f2cdeb6424d82f45961f803d812d6c99" }
commonware-storage = { git = "https://github.com/commonwarexyz/monorepo", rev = "2fd3af88f2cdeb6424d82f45961f803d812d6c99", default-features = false, features = ["std"] }
pin-project = { version = "1.1.13" }
rand_distr = { version = "0.6.0", optional = true }
rayon = { version = "1.12.0", default-features = false }
tracing = { version = "0.1.44" }

[dev-dependencies]
commonware-conformance = { git = "https://github.com/commonwarexyz/monorepo", rev = "2fd3af88f2cdeb6424d82f45961f803d812d6c99" }
commonware-consensus = { path = ".", features = ["mocks"] }
commonware-resolver = { git = "https://github.com/commonwarexyz/monorepo", rev = "2fd3af88f2cdeb6424d82f45961f803d812d6c99", features = ["mocks"] }
commonware-runtime = { git = "https://github.com/commonwarexyz/monorepo", rev = "2fd3af88f2cdeb6424d82f45961f803d812d6c99", features = ["test-utils"] }
paste = { version = "1.0.15" }
rand = { version = "0.10.2", default-features = false, features = ["alloc"] }
rand_chacha = { version = "0.10.0", default-features = false }
rstest = { version = "0.26.1" }
tracing-subscriber = { version = "0.3.23" }

[package.metadata.cargo-udeps.ignore]
development = ["commonware-consensus"]

[lib]
bench = false

[features]
mocks = [
	"commonware-cryptography/mocks",
	"commonware-p2p/mocks",
	"commonware-resolver/mocks",
	"dep:rand_distr",
]
arbitrary = [
	"commonware-codec/arbitrary",
	"commonware-coding/arbitrary",
	"commonware-cryptography/arbitrary",
	"commonware-math/arbitrary",
	"commonware-p2p/arbitrary",
	"commonware-resolver/arbitrary",
	"commonware-runtime/arbitrary",
	"commonware-storage/arbitrary",
	"commonware-utils/arbitrary",
	"dep:arbitrary",
]
